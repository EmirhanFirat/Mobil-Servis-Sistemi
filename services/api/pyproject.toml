# Bu dosya paket üretmez; yalnızca araç ayarlarını tutar.
# Bağımlılıklar requirements*.in dosyalarından pip-compile ile kilitlenir.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
