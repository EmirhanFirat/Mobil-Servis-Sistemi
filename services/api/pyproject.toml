# Bu dosya paket üretmez; yalnızca araç ayarlarını tutar.
# Bağımlılıklar requirements*.in dosyalarından pip-compile ile kilitlenir.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Testlerde uzun Türkçe örnek metinler okunabilirlik için tek satırda kalır.
"tests/**" = ["E501"]
# Sağlayıcıya giden soru metinleri veridir; satır bölmek içeriği ve özetini bozmadan okunaksız yapar.
"app/decision/jev_questions.py" = ["E501"]
# Markdown tablo satırları bölünemez.
"app/evaluation/report.py" = ["E501"]
"app/evaluation/detail.py" = ["E501"]
"app/evaluation/preflight.py" = ["E501"]
# Panele giden Türkçe uyarı ve açıklama metinleri (kullanıcıya görünen düz metin) satır bölünce okunaksız olur.
"app/experiments.py" = ["E501"]
# Migration'lardaki CHECK ifadeleri tek bir SQL metnidir; bölmek içeriği değiştirir.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
# Yerel "alembic/" klasörü (migration'lar) paket adıyla çakıştığı için açıkça belirtilir.
known-third-party = ["alembic"]
